# Zola configuration for asili-programming.github.io.
# Swahili is the default language and lives at the root; English lives under /en/.
base_url = "https://asili-programming.github.io"
title = "Asili"
description = "Asili ni lugha ya programu inayotumia Kiswahili. Pata ni zana yake."
default_language = "sw"
compile_sass = false
build_search_index = false
generate_feeds = false
minify_html = false

[markdown]
# ```asili blocks are highlighted with syntaxes/asili.sublime-syntax (generated from the IDE).
highlight_code = true
highlight_theme = "css"
extra_syntaxes_and_themes = ["syntaxes"]

